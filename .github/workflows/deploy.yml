name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ok=1
          [ -n "$VPS_HOST" ] || { echo "ERROR: missing VPS_HOST"; ok=0; }
          [ -n "$VPS_USER" ] || { echo "ERROR: missing VPS_USER"; ok=0; }
          [ -n "$VPS_PASSWORD" ] || { echo "ERROR: missing VPS_PASSWORD"; ok=0; }
          [ -n "$VPS_APP_DIR" ] || { echo "ERROR: missing VPS_APP_DIR"; ok=0; }
          if [ "$ok" -ne 1 ]; then
            echo "Add Repository secrets at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Required secrets are present."

      - name: Deploy to VPS (git pull + docker build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Cloning repository into $APP_DIR"
              mkdir -p "$(dirname "$APP_DIR")"
              git clone https://github.com/ebrahim5529/wathiq.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              if [ -f .env.example ]; then
                cp .env.example .env
                echo "Created .env from .env.example — update passwords on the server if needed."
              else
                echo "ERROR: .env missing in $APP_DIR"
                exit 1
              fi
            fi

            # Ensure image name works for local builds
            if ! grep -q '^WEB_IMAGE=' .env; then
              echo 'WEB_IMAGE=wathiq-web:local' >> .env
            else
              sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=wathiq-web:local|' .env
            fi

            docker compose build web
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
