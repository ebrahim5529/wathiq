name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: wathiq

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER_LC}/${REPO_LC}"
          TAG="${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ok=1
          [ -n "$VPS_HOST" ] || { echo "ERROR: Repository secret VPS_HOST is missing/empty"; ok=0; }
          [ -n "$VPS_USER" ] || { echo "ERROR: Repository secret VPS_USER is missing/empty"; ok=0; }
          [ -n "$VPS_PASSWORD" ] || { echo "ERROR: Repository secret VPS_PASSWORD is missing/empty"; ok=0; }
          [ -n "$VPS_APP_DIR" ] || { echo "ERROR: Repository secret VPS_APP_DIR is missing/empty"; ok=0; }
          if [ "$ok" -eq 1 ]; then
            echo "All required repository secrets are present."
          else
            echo "Add them at: Settings → Secrets and variables → Actions → Repository secrets"
            echo "Exact name required: VPS_PASSWORD"
            exit 1
          fi

      - name: Deploy to VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 10m
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            cd "$APP_DIR"

            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            fi

            export WEB_IMAGE="${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}"
            docker compose pull web || true
            docker compose up -d --remove-orphans
            docker image prune -f
