name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deploy secrets exist
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          ok=1
          [ -n "$VPS_HOST" ] || { echo "ERROR: missing VPS_HOST"; ok=0; }
          [ -n "$VPS_USER" ] || { echo "ERROR: missing VPS_USER"; ok=0; }
          [ -n "$VPS_PASSWORD" ] || { echo "ERROR: missing VPS_PASSWORD"; ok=0; }
          [ -n "$VPS_APP_DIR" ] || { echo "ERROR: missing VPS_APP_DIR"; ok=0; }
          if [ "$ok" -ne 1 ]; then
            echo "Add Repository secrets at Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "Required secrets are present."

      - name: Deploy to VPS (git pull + docker build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.VPS_APP_DIR }}"
            REPO_URL="https://github.com/ebrahim5529/wathiq.git"

            mkdir -p "$(dirname "$APP_DIR")"

            if [ -d "$APP_DIR/.git" ]; then
              echo "Updating existing git repository in $APP_DIR"
              cd "$APP_DIR"
              git remote set-url origin "$REPO_URL" || true
              git fetch origin main
              git reset --hard origin/main
            else
              echo "Preparing clean git checkout in $APP_DIR"
              if [ -f "$APP_DIR/.env" ]; then
                cp "$APP_DIR/.env" /tmp/wathiq.env.bak
              fi
              rm -rf "$APP_DIR"
              git clone --branch main "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
              if [ -f /tmp/wathiq.env.bak ]; then
                mv /tmp/wathiq.env.bak .env
              fi
            fi

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Created .env from example — edit DB passwords on the server if needed."
            fi

            # Force local image name so compose builds instead of pulling GHCR
            if grep -q '^WEB_IMAGE=' .env; then
              sed -i 's|^WEB_IMAGE=.*|WEB_IMAGE=wathiq-web:local|' .env
            else
              echo 'WEB_IMAGE=wathiq-web:local' >> .env
            fi

            docker compose build web
            docker compose up -d --remove-orphans
            docker compose ps
            docker image prune -f
