services:
  db:
    image: mysql:8.4
    container_name: wathiq-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-HR_Archive}
      MYSQL_USER: ${MYSQL_USER:-wathiq}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wathiq_mysql_data:/var/lib/mysql
    # متاح فقط على localhost السيرفر — اتصل عبر SSH Tunnel
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - wathiq-net

  web:
    image: ${WEB_IMAGE:-wathiq-web:local}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: missing
    container_name: wathiq-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-HR_Archive};User=${MYSQL_USER:-wathiq};Password=${MYSQL_PASSWORD};"
      APPLY_MIGRATIONS: "true"
      DISABLE_HTTPS_REDIRECTION: "true"
    # مع Traefik يمكن إغلاق نشر المنفذ بوضع WEB_PUBLISH_PORT فارغ
    ports:
      - "${WEB_PUBLISH_PORT:-8080}:8080"
    volumes:
      - wathiq_uploads:/app/uploads
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.wathiq.rule=Host(`${WATHIQ_DOMAIN:-archive.example.com}`)
      - traefik.http.routers.wathiq.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.wathiq.tls=true
      - traefik.http.routers.wathiq.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.wathiq.loadbalancer.server.port=8080
    networks:
      - wathiq-net
      - traefik

volumes:
  wathiq_mysql_data:
  wathiq_uploads:

networks:
  wathiq-net:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
